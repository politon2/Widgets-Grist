<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edition — TaskFlow</title>
<style>
:root {
  --primary:#3e5de7; --primary-dark:#2845c1; --primary-light:#dce6ff;
  --bg:#f8fafc; --card-bg:#fff; --text:#1e293b; --text-muted:#64748b;
  --border:#e2e8f0; --shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}
body{padding:30px}
.page{max-width:1040px;margin:0 auto}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}
h1{font-size:1.45rem;color:var(--primary);line-height:1.2}
.subtitle{margin-top:6px;color:var(--text-muted);font-size:.82rem}
.back{border:1px solid var(--border);background:var(--card-bg);color:var(--text-muted);border-radius:6px;padding:7px 10px;font:inherit;font-size:.76rem;cursor:pointer;white-space:nowrap}
.back:hover{border-color:var(--primary);color:var(--primary)}
.links{display:grid;grid-template-columns:1fr;gap:14px}
.link{display:flex;align-items:center;gap:12px;padding:16px;text-decoration:none;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);color:var(--text);transition:border-color .15s,background .15s,transform .15s}
.link:hover{border-color:var(--primary);background:var(--primary-light);transform:translateY(-1px)}
.icon{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:var(--primary-light);color:var(--primary);font-size:1.1rem;flex:none}
.link-title{font-size:.88rem;font-weight:600}
.link-text{margin-top:3px;color:var(--text-muted);font-size:.74rem;line-height:1.35}
@media(max-width:560px){body{padding:20px}.header{flex-direction:column}.back{align-self:flex-start}}
</style>
</head>
<body>
<main class="page">
  <header class="header">
    <div><h1>Edition</h1><p class="subtitle">Edition des tables de référentiel dans Grist.</p></div>
    <button class="back" type="button" onclick="goBack()">← Retour</button>
  </header>
  <section class="links" aria-label="Outils d’édition">
    <a class="link" href="../../edit_fiche/grist-fiche-widget-table.html?table=Team" onclick="return openTool('editionTable', event)">
      <span class="icon">✎</span><span><span class="link-title">Table Team</span> <span class="link-text">Liste des acteurs des différentes équipes.</span></span>
    </a>
    <a class="link" href="../../edit_fiche/grist-fiche-widget-table.html?table=Projects" onclick="return openTool('editionTable', event)">
      <span class="icon">✎</span><span><span class="link-title">Table Projects</span> <span class="link-text">Liste des projets.</span></span>
    </a>
    <a class="link" href="../../edit_fiche/grist-fiche-widget-table.html?table=Moa" onclick="return openTool('editionTable', event)">
      <span class="icon">✎</span><span><span class="link-title">Table MOA</span> <span class="link-text">Liste des MOA.</span></span>
    </a>
    <a class="link" href="../../edit_fiche/grist-fiche-widget-table.html?table=Divisions" onclick="return openTool('editionTable', event)">
      <span class="icon">✎</span><span><span class="link-title">Table Divisions</span> <span class="link-text">Liste des divisions.</span></span>
    </a>
    <a class="link" href="../../edit_fiche/grist-fiche-widget-table.html?table=Budget" onclick="return openTool('editionTable', event)">
      <span class="icon">✎</span><span><span class="link-title">Table Budget</span> <span class="link-text">Liste des budgets.</span></span>
    </a>
  </section>
</main>
<script>
function openTool(id, event){
  if(window.parent && typeof window.parent.go==='function'){
    event.preventDefault();
    const url = new URL(event.currentTarget.href, window.location.href);
    const params = Object.fromEntries(url.searchParams.entries());
    window.parent.go(id, params);
    return false;
  }
  return true;
}
function goBack(){
  if(window.parent && typeof window.parent.go==='function') window.parent.go('dashboard');
  else window.history.back();
}
</script>
</body>
</html>
